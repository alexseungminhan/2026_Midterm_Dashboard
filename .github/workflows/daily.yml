name: daily forecast

# 매일 한 번 파이프라인을 돌려 forecast.json 을 갱신하고 커밋한다.
# 커밋이 생기면 Render Static Site 가 그것을 감지해 재배포한다.
# 사람이 푸시할 일은 여론조사 엑셀을 바꿀 때뿐이다.

on:
  schedule:
    # GitHub cron 은 UTC 다. 20:00 UTC 는 명목상 한국 시간 다음날 05:00 이지만,
    # 공유 스케줄러 지연 때문에 실제 시작은 그보다 한참 늦다. 2026-08 중순에는
    # 20~40분이었고 2026-09 에는 2~3시간대로 밀려서, 실제 갱신 시각은 한국
    # 시간 오전 7~8시다. 지연은 우리가 통제할 수 없고 늘어나는 추세다.
    #
    # 2026-09-13: 3일 간격("0 20 */3 * *")에서 매일로 바꿨다. 이유 두 가지.
    #   1) 선거가 가까워 시장이 빠르게 움직인다. 실제로 상원 다수당 확률이
    #      3일 간격 사이에 50% 선을 넘어가, 화면이 "공화 우세"에서 "민주
    #      우세"로 통째로 뒤집힌 채 며칠을 서 있었다.
    #   2) */3 은 날짜 기준이라 매달 1일에 리셋된다. 8/31 다음이 9/1 이라
    #      실제 간격이 3일이 아니라 1~3일로 불규칙했다.
    #
    # 비용은 문제가 아니다. 공개 저장소라 Actions 사용량이 무료이고, FEC
    # 캐시 키가 ISO 주 단위여서 매일 돌려도 캐시는 주중 내내 살아 있다.
    # 2026-09 기준 런은 대부분 3~6분이었다.
    - cron: "0 20 * * *"
  workflow_dispatch:        # Actions 탭에서 손으로도 돌릴 수 있게

# 커밋을 되밀어야 하므로 쓰기 권한이 필요하다.
permissions:
  contents: write

concurrency:
  # 앞선 실행이 아직 돌고 있으면 겹쳐 돌리지 않는다. 두 파이프라인이 같은
  # raw 캐시에 동시에 쓰면 반쯤 쓰인 JSON 을 서로 읽는다.
  group: daily-forecast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # The FIRST run on a cold cache is the expensive one: FEC is rate-limited
    # to one request every 1.05s and a cold board needs thousands of them, so
    # the wait alone runs 30-75 minutes before anything else. 90 minutes was
    # not enough and the job was killed twice — and because actions/cache only
    # saves on success, each kill threw away the cache it had just built, so
    # the next run started cold again. Nothing could ever converge.
    #
    # Once the cache lands, FEC filing dates hold for a week and the run drops
    # back to ~20 minutes.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r election2026/requirements.txt

      # FEC 원본 캐시(약 43MB). 이게 없으면 레이스별 신고 시점 탐색을 매번
      # 처음부터 해서 훨씬 느려지고 FEC 시간당 1,000건 한도에 닿는다.
      # 캐시 자체가 1주일 TTL 이므로 키도 ISO 주 단위로 끊는다 — 매 실행마다
      # 새 키를 쓰면 43MB 짜리 캐시가 하루 하나씩 쌓인다.
      - id: week
        run: echo "id=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # restore + save are SPLIT so the cache is written even when the run
      # fails or is cancelled. actions/cache's combined form only saves on
      # success, which is exactly the case that kept the cold cache cold.
      - name: Restore FEC cache
        id: fec-cache
        uses: actions/cache/restore@v6
        with:
          path: election2026/data/raw/track_b/fec
          key: fec-${{ steps.week.outputs.id }}
          restore-keys: fec-

      - name: Run pipeline
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          # FRED's keyless CSV host times out from GitHub's runners; the
          # official API takes a free key and answers normally. Without this
          # the economy model is empty on every cloud run.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m election2026 run

      # 스키마를 통과하지 못한 결과는 커밋하지 않는다. 깨진 forecast.json 이
      # 배포되면 대시보드가 빈 화면이 된다.
      - name: Save FEC cache
        if: always()          # especially on timeout — see above
        uses: actions/cache/save@v6
        with:
          path: election2026/data/raw/track_b/fec
          key: fec-${{ steps.week.outputs.id }}-${{ github.run_id }}

      - name: Validate
        run: python -m election2026 validate

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 2026-08-08 이후 기초 지표는 런 사이에 아무 상태도 이어받지
          # 않는다 — 양면 변수는 그날의 두 값을 서로 비교하고, 관심도는
          # 같은 런의 다른 레이스와 비교하며, 경제·예비선거는 소스가 과거를
          # 함께 준다. 그래서 baselines/ 를 커밋할 이유가 없다.
          # history/ 는 남긴다: 전일 대비 변화(movers)의 비교 대상이다.
          git add election2026/data/forecast.json \
                  election2026/data/history \
                  election2026/data/prediction_log.jsonl
          if git diff --cached --quiet; then
            echo "변화 없음 — 커밋 생략"
          else
            git commit -m "data: 자동 갱신 $(date -u +%Y-%m-%d)"
            # 사람이 그 사이 여론조사를 커밋했을 수 있다. 우리 커밋은 데이터
            # 파일만 건드리므로 rebase 로 얹으면 충돌 없이 올라간다.
            git pull --rebase --autostash
            git push
          fi

      # 2026-09-13: Render 가 2026-08-12 이후 재배포를 멈춘 채였다. Actions 는
      # 11번 정상 커밋했는데 사이트는 한 달 내내 옛 숫자를 서빙했고, 그 사이
      # 상원 다수당 확률이 50% 선을 넘어가 사이트만 "공화당 54%" 로 뒤집혀
      # 있었다. 배포본의 last-modified 가 마지막 *사람* 커밋 시각과 정확히
      # 일치했으므로, Render 의 웹훅이 봇 푸시에 반응하지 않았던 것으로 보인다.
      #
      # 원인이 무엇이든 Render 의 자동 감지에 기대지 않고 우리가 직접 찌른다.
      # 시크릿이 없으면 조용히 건너뛰므로, 설정 전에도 워크플로는 깨지지 않는다.
      #
      # 설정법: Render 대시보드 > 해당 Static Site > Settings > Deploy Hook 의
      # URL 을 복사해서, GitHub 저장소 Settings > Secrets and variables >
      # Actions 에 RENDER_DEPLOY_HOOK 이라는 이름으로 넣을 것.
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${HOOK:-}" ]; then
            echo "RENDER_DEPLOY_HOOK 시크릿이 없다 — Render 자체 Auto-Deploy 에"
            echo "의존한다. 아래 Verify 스텝이 실패하면 이 시크릿부터 넣을 것."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Render 배포를 트리거했다."

      # 커밋했다고 배포된 것이 아니다 — 위 사고가 정확히 그 틈에서 났다.
      # 실제로 사이트가 새 forecast.json 을 서빙하는지 확인될 때까지 기다리고,
      # 안 되면 실패시켜 메일이 가게 한다. 이 스텝이 있었다면 2026-08-13 에
      # 잡혔을 문제다.
      - name: Verify deployed site
        env:
          SITE: https://two026-midterm-dashboard.onrender.com
        run: |
          python - <<'EOF'
          import json, os, sys, time, urllib.request

          want = json.load(open("election2026/data/forecast.json"))["meta"]["generated_at"]
          url = os.environ["SITE"].rstrip("/") + "/forecast.json"
          print("기대하는 generated_at:", want)
          print("확인할 주소:", url)

          deadline = time.time() + 600      # Render 정적 빌드는 보통 1~2분이다
          got = None
          while time.time() < deadline:
              try:
                  req = urllib.request.Request(
                      url, headers={"Cache-Control": "no-cache"})
                  got = json.load(urllib.request.urlopen(req, timeout=30))["meta"]["generated_at"]
              except Exception as exc:
                  print("조회 실패:", exc)
              else:
                  if got == want:
                      print("배포 확인됨:", got)
                      sys.exit(0)
                  print("아직 옛 버전을 서빙 중:", got)
              time.sleep(30)

          print("::error::Render 가 10분 안에 새 forecast.json 을 서빙하지 "
                "않았다. 커밋은 성공했지만 사이트는 %s 에 멈춰 있다. Render 의 "
                "Auto-Deploy 설정과 배포 로그를 확인하고, RENDER_DEPLOY_HOOK "
                "시크릿을 넣을 것." % got)
          sys.exit(1)
          EOF

      # 공개 저장소의 스케줄 워크플로는 저장소에 60일간 활동이 없으면 GitHub 가
      # 자동으로 비활성화한다. 문제는 위에서 미는 커밋이 github-actions[bot]
      # 명의라는 것이다 — 봇 푸시로는 이 타이머가 리셋되지 않는다고 널리
      # 보고돼 있다. GitHub 문서가 "repository activity" 의 정의를 명시하지
      # 않아 확정은 아니지만, 틀렸을 때의 대가가 크다: 꺼져도 알림이 없어서
      # 대시보드가 조용히 옛 숫자에 멈춰 선다. 실제로 2026-08 에 로컬
      # 체크아웃이 한 달 뒤처진 걸 아무도 몰랐던 전례가 있다.
      #
      # 그래서 사람 커밋이 45일을 넘기면 이 잡을 일부러 실패시킨다. 실패하면
      # GitHub 가 저장소 소유자에게 메일을 보내므로 조용한 고장이 시끄러운
      # 고장이 된다. 60일이 아니라 45일로 잡은 건 대응할 시간을 벌기 위해서다.
      #
      # 데이터 커밋 *뒤에* 두었으므로 이 스텝이 실패해도 갱신 자체는 이미
      # 끝나 있다. 경고 메일을 받으면 사람 계정으로 아무 커밋이나 푸시하면
      # 타이머가 리셋된다.
      #
      # git log 대신 API 를 쓰는 이유: checkout 이 fetch-depth 1 이라 로컬에는
      # 커밋이 하나뿐이고, 전체 이력을 받게 바꾸면 history/ 스냅샷 때문에
      # 클론이 무거워진다.
      - name: Keepalive canary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import datetime, json, os, sys, urllib.request

          BOT = "github-actions[bot]"
          LIMIT_DAYS = 45

          url = ("https://api.github.com/repos/%s/commits?per_page=100"
                 % os.environ["GITHUB_REPOSITORY"])
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json"})
          commits = json.load(urllib.request.urlopen(req))

          now = datetime.datetime.now(datetime.timezone.utc)
          for c in commits:
              login = ((c.get("author") or {}).get("login")) or ""
              if login == BOT:
                  continue
              when = c["commit"]["committer"]["date"]
              t = datetime.datetime.fromisoformat(when.replace("Z", "+00:00"))
              days = (now - t).days
              print("마지막 사람 커밋: %s (%s) — %d일 경과" % (when, login, days))
              if days >= LIMIT_DAYS:
                  print("::error::저장소 무활동 %d일. 60일이 되면 이 스케줄 "
                        "워크플로가 자동 비활성화되고 대시보드 갱신이 알림 "
                        "없이 멈춘다. 사람 계정으로 아무 커밋이나 푸시할 것."
                        % days)
                  sys.exit(1)
              print("여유 %d일" % (LIMIT_DAYS - days))
              break
          else:
              print("::error::최근 100커밋이 전부 봇이다. 이미 위험 구간일 수 "
                    "있으니 사람 계정으로 커밋을 푸시할 것.")
              sys.exit(1)
          EOF
