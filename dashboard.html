<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 미국 중간선거 대시보드</title>
<style>
/* Palette: dataviz reference instance. The only color job here is DIVERGING
   polarity (민주당 ↔ 공화당), which maps onto the blue↔red pair with a gray
   midpoint. Validated with the six checks in both modes, all-pairs:
     light #2a78d6/#e34948 — CVD ΔE 21.6, normal ΔE 32.3, contrast ≥3:1  PASS
     dark  #3987e5/#e66767 — CVD ΔE 19.2, normal ΔE 29.0, contrast ≥3:1  PASS
   Color never carries meaning alone: every bar is direct-labeled and every
   lean chip ships an arrow glyph plus a word. */
/* DARK IS THE DEFAULT (2026-08-08 요청). :root carries the dark palette and
   [data-theme="light"] carries the light one, so the toggle turns the page
   light rather than dark. prefers-color-scheme is deliberately NOT consulted:
   the page has a chosen look, and the button is the only thing that changes it. */
:root {
  color-scheme: dark;
  --plane:     #0d0d0d;
  --surface:   #1a1a19;
  --surface-2: #242422;
  --line:      #34342f;
  --ink:       #ffffff;
  --ink-2:     #c3c2b7;
  --ink-3:     #8d8c83;
  --dem:       #3987e5;
  --rep:       #e66767;
  --neutral:   #46453f;
  --dem-soft:  #1c3555;
  --rep-soft:  #4a2626;
  --warn:      #fab219;
  --radius:    4px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --plane:     #f9f9f7;
  --surface:   #fcfcfb;
  --surface-2: #f2f2ef;
  --line:      #e2e2dd;
  --ink:       #0b0b0b;
  --ink-2:     #52514e;
  --ink-3:     #83827c;
  --dem:       #2a78d6;
  --rep:       #e34948;
  --neutral:   #d8d7d2;
  --dem-soft:  #dbe8fa;
  --rep-soft:  #fadcdc;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--plane);
  color: var(--ink);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Malgun Gothic", "Noto Sans KR", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 80px; }
@media (max-width: 560px) { .wrap { padding: 20px 14px 60px; } }

/* ---- header ---- */
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
         margin-bottom: 26px; }
header h1 { flex-basis: 100%; }
h1 { font-size: 52px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.03em;
     line-height: 1.08; }
@media (max-width: 760px) { h1 { font-size: 36px; } }
.stamp { color: var(--ink-3); font-size: 13px; }
.theme-btn {
  margin-left: auto; background: var(--surface); color: var(--ink-2);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
}
.lede { color: var(--ink-2); font-size: 13.5px; margin: 0 0 24px;
        max-width: 62ch; }

section { margin-bottom: 34px; }
h2 { font-size: 15px; font-weight: 650; margin: 0 0 4px; }
.sub { color: var(--ink-3); font-size: 12.5px; margin: 0 0 14px; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 18px 20px;
}

/* ---- balance of power ---- */
.bop-row {
  display: grid; grid-template-columns: 150px 1fr 52px;
  align-items: center; gap: 12px; padding: 5px 0;
}
@media (max-width: 560px) {
  .bop-row { grid-template-columns: 110px 1fr 46px; gap: 8px; }
  .bop-name { font-size: 12px; }
}
.bop-name { font-size: 13.5px; color: var(--ink-2); }
.bop-track { background: var(--surface-2); border-radius: var(--radius);
             height: 20px; overflow: hidden; }
.bop-fill { height: 100%; border-radius: var(--radius); }
.bop-val { font-variant-numeric: tabular-nums; font-size: 13.5px;
           text-align: right; color: var(--ink); }

/* ---- chamber cards ---- */
.chambers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
@media (max-width: 860px) { .chambers { grid-template-columns: 1fr; } }
.ch-name { font-size: 19px; font-weight: 650; color: var(--ink);
           margin-bottom: 10px; letter-spacing: -0.01em; }
.ch-hero { font-size: 30px; font-weight: 650; letter-spacing: -0.02em;
           line-height: 1.1; font-variant-numeric: tabular-nums; }
.ch-hero small { font-size: 13px; font-weight: 400; color: var(--ink-2);
                 display: block; margin-top: 3px; letter-spacing: 0; }
.ch-seats { margin-top: 14px; font-size: 12.5px; color: var(--ink-2); }

.footnote { font-size: 11.5px; color: var(--ink-3); margin-top: 10px;
            line-height: 1.45; }

/* ---- movers ---- */
/* Marquee driven from JS, not a CSS animation: the CSS version silently does
   nothing for anyone with "reduce motion" on, and it also scrolls when the
   list already fits. */
.mv-viewport { overflow: hidden; }
.movers-card { padding: 12px 20px; }
.mv-track { display: flex; width: max-content; will-change: transform; }
.movers { display: flex; flex-wrap: nowrap; gap: 8px; padding-right: 8px; }
.mover { flex: none; }
.mover {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 12px; font-size: 12.5px;
  display: inline-flex; align-items: center; gap: 7px;
}
.mover b { font-weight: 550; }
.mv-up { color: var(--dem); } .mv-dn { color: var(--rep); }

/* ---- race table ---- */
/* The table is the one thing that cannot shrink to a phone: six columns of
   numbers. It scrolls inside its own box so the PAGE never does. */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; min-width: 560px; }
thead th {
  font-size: 11.5px; font-weight: 550; color: var(--ink-3);
  text-align: left; padding: 0 10px 8px; border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
thead th.num { text-align: right; }
thead th.prob { text-align: center; }
tbody tr { border-bottom: 1px solid var(--line); cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
tbody td { padding: 10px; vertical-align: middle; font-size: 13.5px; }
td.num { text-align: right; font-variant-numeric: tabular-nums;
         white-space: nowrap; }
.rank { color: var(--ink-3); font-size: 12px; width: 26px; }
.race-name { font-weight: 550; }
.race-cand { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }

/* the two probability columns */
/* Bar and number travel together and sit centred in the column, so the
   header lands over the pair instead of over the number alone — the bar
   used to stick out to the left of its own heading. */
.pcell { display: flex; align-items: center; justify-content: center;
         gap: 8px; }
.pbar { width: 54px; height: 6px; background: var(--surface-2);
        border-radius: 3px; overflow: hidden; flex: none; }
.pbar i { display: block; height: 100%; border-radius: 3px; }
.pnum { min-width: 74px; text-align: right; white-space: nowrap; }
.chip.sum { font-size: 12px; padding: 3px 8px; }

/* chamber tabs */
.sec-head { display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.tabs { display: flex; border: 1px solid var(--line); border-radius: var(--radius);
        overflow: hidden; flex: none; }
.tab { font: inherit; font-size: 12.5px; padding: 5px 14px; cursor: pointer;
       border: 0; border-left: 1px solid var(--line);
       background: var(--surface); color: var(--ink-2); white-space: nowrap; }
.tab:first-child { border-left: 0; }
.tab.on { background: var(--ink); color: var(--surface); }
/* The party word is the point of the cell — never let colour carry it alone. */
.pparty { font-size: 11px; font-weight: 600; }
.none { color: var(--ink-3); font-size: 12px; display: block;
        text-align: center; }

/* model lean chips */
.chips { display: flex; gap: 4px; }
.chip {
  font-size: 11px; padding: 2px 6px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface-2);
  color: var(--ink-3); white-space: nowrap;
}
.chip.d { background: var(--dem-soft); border-color: transparent;
          color: var(--dem); }
.chip.r { background: var(--rep-soft); border-color: transparent;
          color: var(--rep); }
.chip.a { background: var(--surface-2); color: var(--ink-2); }

.badge-warn {
  font-size: 11px; color: var(--ink); background: var(--warn);
  border-radius: var(--radius); padding: 1px 5px; margin-left: 6px;
}

/* ---- detail row ---- */
tr.detail > td { background: var(--surface-2); padding: 4px 10px 18px; }
.models { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
          margin-top: 8px; }
@media (max-width: 860px) { .models { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .models { grid-template-columns: 1fr; } }
.model {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 12px;
}
.model h4 { margin: 0 0 2px; font-size: 12.5px; font-weight: 600; }
.model .q { font-size: 11.5px; color: var(--ink-3); margin-bottom: 8px;
            line-height: 1.4; }
.model .verdict { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.model .meta div { padding: 1px 0; }
.meta { font-size: 11px; color: var(--ink-3); }
.vars { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line);
        font-size: 11px; color: var(--ink-2); }
.vars div { display: flex; justify-content: space-between; gap: 8px;
            padding: 1.5px 0; }
.vars .off { color: var(--ink-3); }
.vars .unit-note { display: block; color: var(--ink-3); font-size: 10.5px;
                   line-height: 1.45; padding-bottom: 4px; }
.vars span.z { font-variant-numeric: tabular-nums; }

.explain { font-size: 12px; color: var(--ink-2); margin: 10px 0 0;
           line-height: 1.5; }
.loading, .error { padding: 40px 0; color: var(--ink-2); }
.error b { color: var(--rep); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2026 미국 중간선거 대시보드</h1>
    <span class="stamp" id="stamp"></span>
    <button class="theme-btn" id="theme">테마</button>
  </header>
  <div id="app"><p class="loading">불러오는 중…</p></div>
</div>

<script>
const FMT = (p, d = 0) => (100 * p).toFixed(d) + "%";
/* Signed fixed-point without JavaScript's negative zero: (-0.004).toFixed(2)
   renders "-0.00", which reads as a Republican lean that isn't there. */
const SIGNED = (v, d = 2) => {
  const s = v.toFixed(d);
  return /^-0\.?0*$/.test(s) ? s.slice(1) : (v > 0 ? "+" + s : s);
};
const MONEY = v =>
  v >= 1e6 ? "$" + (v / 1e6).toFixed(1) + "M" :
  v >= 1e3 ? "$" + Math.round(v / 1e3) + "K" : "$" + Math.round(v);
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
};

const LEAN_WORD = { D: "민주", R: "공화", N: "중립" };
const LEAN_ARROW = { D: "▲", R: "▼", N: "–" };
const LEVEL_WORD = { high: "높음", normal: "보통", low: "낮음" };
const STRENGTH = ["경합", "다소 우세", "우세", "매우 우세"];
const WHY_NONE = {
  structural: "데이터 없음 (제도상 존재하지 않음)",
  pending: "데이터 없음 (아직 시점 전)",
  missing: "데이터 없음"
};

/* What the numbers under each model mean. Stated per model because the four
   are measured differently — see README "런 사이에 상태를 이어받지 않는다". */
const BASIS = {
  economy: {
    unit: "각 지표의 <b>1년 전 대비 변화</b>입니다. 경기가 좋아지면 " +
          "상·하원은 대통령 정당, 주지사는 현직 정당에 유리하도록 " +
          "처리하였습니다. <b>+면 민주당에 유리</b>합니다."
  },
  money: {
    unit: ""
  },
  grassroots: {
    unit: "<b>2022년 대비 예비선거 투표율 증가율</b>."
  },
  attention: {
    unit: "두 후보의 위키백과 조회수 비중과 편집 횟수."
  },
  _default: { unit: "" }
};

/* Both sides in their own unit, and the gap between them in that same unit.
   The bracket used to hold the normalized contrast (+0.20), which is what the
   model averages but not something a reader can check against the two numbers
   beside it. 60.0% vs 40.0% is +20.0%p; that they can. */
const _UNIT = {
  fec_in_state_share:     { pct: true,  suffix: "%p" },
  wiki_pageviews_share:   { pct: true,  suffix: "%p" },
  primary_turnout_ratio:  { pct: false, suffix: "%p", already: true },
  fec_small_dollar_count: { pct: false, suffix: "건" },
  wiki_edit_count:        { pct: false, suffix: "회" }
};
function _sideText(v) {
  if (v.dem_value == null || v.rep_value == null) return SIGNED(v.z);
  const u = _UNIT[v.variable] || { pct: false, suffix: "" };
  const scale = u.pct ? 100 : 1;                 // shares arrive as 0..1
  const d = v.dem_value * scale, r = v.rep_value * scale;
  const dec = (u.pct || u.already) ? 1 : 0;
  const f = x => x.toLocaleString("ko-KR", { minimumFractionDigits: dec,
                                             maximumFractionDigits: dec });
  const tail = (u.pct || u.already) ? "%" : "";
  const gap = d - r;
  const lead = gap >= 0 ? "민주" : "공화";
  const col = gap >= 0 ? "var(--dem)" : "var(--rep)";
  return "민주 " + f(d) + tail + " · 공화 " + f(r) + tail +
         "  (<b style='color:" + col + "'>" + lead + " +" +
         f(Math.abs(gap)) + u.suffix + "</b>)";
}

/* ---------- balance of power ---------- */
function balanceSection(rows) {
  const s = el("section");
  s.appendChild(el("h2", null, "전체 판세"));
  const card = el("div", "card");
  rows.slice().sort((a, b) => b.prob - a.prob).forEach(r => {
    const color = /Democrats Sweep/.test(r.outcome) ? "var(--dem)"
                : /Republicans Sweep/.test(r.outcome) ? "var(--rep)"
                : "var(--neutral)";
    const row = el("div", "bop-row");
    /* Party words carry the colour so the row reads without the bar. */
    const nm = el("div", "bop-name");
    nm.innerHTML = (r.label || r.outcome)
      .replace(/민주당?/g, "<b style='color:var(--dem)'>$&</b>")
      .replace(/공화당?/g, "<b style='color:var(--rep)'>$&</b>");
    row.appendChild(nm);
    const track = el("div", "bop-track");
    const fill = el("div", "bop-fill");
    /* Width IS the probability. It used to be scaled to the largest row, so
       45.4% drew a completely full bar and read as a certainty. */
    fill.style.width = (100 * r.prob) + "%";
    fill.style.background = color;
    track.appendChild(fill);
    track.title = (r.label || r.outcome) + " " + FMT(r.prob, 1);
    row.appendChild(track);
    row.appendChild(el("div", "bop-val", FMT(r.prob, 1)));
    card.appendChild(row);
  });
  const other = rows.find(r => /Other/i.test(r.outcome));
  card.appendChild(el("p", "footnote",
    "출처: Polymarket \u2018Balance of Power: 2026 Midterms\u2019" +
    (other ? "<br>주: \u2018기타\u2019 " + FMT(other.prob, 1) + "는 위 네 " +
             "가지로 떨어지지 않는 경우 (동수, 무소속의 교섭단체 선택, 공석) " +
             "입니다." : "")));
  s.appendChild(card);
  return s;
}

/* ---------- chambers ---------- */
function chamberCard(key, c) {
  const card = el("div", "card");
  card.appendChild(el("div", "ch-name", c.label));

  if (c.prob_dem_control != null) {
    const lead = c.prob_dem_control >= 0.5;
    const hero = el("div", "ch-hero");
    hero.style.color = lead ? "var(--dem)" : "var(--rep)";
    hero.innerHTML = FMT(lead ? c.prob_dem_control : 1 - c.prob_dem_control) +
      "<small>" + (lead ? "민주당" : "공화당") + "이 다수당이 될 확률 · 시장 " +
      MONEY(c.control_volume) + "</small>";
    card.appendChild(hero);
  }

  /* Seat count only. The bucket chart was removed on request: it asked the
     reader to decode an axis in Republican seats before it said anything,
     and the headline probability above already carries the same call. */
  if (c.favourite_dem_seats != null) {
    card.appendChild(el("div", "ch-seats",
      "<b style='color:var(--dem)'>민주 " + c.favourite_dem_seats +
      "석</b> · <b style='color:var(--rep)'>공화 " + c.favourite_rep_seats +
      "석</b>"));
    card.appendChild(el("p", "footnote",
      "출처: Polymarket<br>주: 각 선거의 현재 선두 후보가 모두 이긴다고 " +
      "가정했을 때의 의석 분포."));
  }
  return card;
}

/* ---------- movers ---------- */
function moversSection(movers) {
  if (!movers.length) return null;
  const s = el("section");
  /* The run is every three days, so "어제" would be wrong. meta carries the
     real gap; fall back to a neutral wording when it is absent. */
  const gap = (window.__DOC && window.__DOC.meta &&
               window.__DOC.meta.change_window_days) || null;
  s.appendChild(el("h2", null,
    (gap === 1 ? "어제보다" : gap ? gap + "일 전보다" : "직전 갱신보다") +
    " 많이 움직인 시장"));
  const box = el("div", "movers");
  movers.forEach(m => {
    const up = m.change > 0;                       // 민주당 쪽으로 움직임
    const dem = m.prob_dem >= 0.5;                 // 지금 앞서는 쪽
    const chip = el("div", "mover");
    chip.innerHTML = "<b>" + m.label + "</b> " +
      "<span class='" + (up ? "mv-up" : "mv-dn") + "'>" +
      (up ? "▲ 민주 " : "▼ 공화 ") + Math.abs(100 * m.change).toFixed(1) +
      "%p</span> <span class='none'>→ " + (dem ? "민주 " : "공화 ") +
      FMT(dem ? m.prob_dem : 1 - m.prob_dem, 1) + "</span>";
    box.appendChild(chip);
  });

  /* One line, scrolling. The list is as long as the day was busy, and
     wrapping it pushed the tables off screen. The strip is duplicated so the
     loop has no visible seam. */
  const clone = box.cloneNode(true);
  clone.setAttribute("aria-hidden", "true");
  const track = el("div", "mv-track");
  track.appendChild(box);
  track.appendChild(clone);
  const vp = el("div", "mv-viewport");
  vp.appendChild(track);
  const card = el("div", "card movers-card");   // same gutters as above
  card.appendChild(vp);
  s.appendChild(card);
  s.appendChild(el("p", "footnote", "주: 0.5%p 이상"));
  _marquee(vp, track, box);
  return s;
}

/* Scrolls only when the strip actually overflows. Driven from JS rather than
   a CSS animation: the CSS version silently does nothing for anyone with
   "reduce motion" on. It does not pause on hover — the loop is short enough
   that a chip comes back around. */
function _marquee(vp, track, first) {
  let x = 0, last = null;
  const step = now => {
    /* Self-terminating. render() runs again on every chamber-tab click and
       builds a fresh strip; without this check each click would leave another
       rAF loop running forever against a detached node, and an open tab would
       accumulate one leak per click. */
    if (!vp.isConnected) return;
    const span = first.scrollWidth;                 // one copy of the list
    if (span > vp.clientWidth) {
      if (last !== null) {
        x -= (now - last) * 0.018;                  // ~18px per second
        if (-x >= span) x += span;                  // seamless wrap
        track.style.transform = "translateX(" + x + "px)";
      }
    } else {
      x = 0;
      track.style.transform = "none";
    }
    last = now;
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------- one probability cell ---------- */
/* Cells are quoted in the LEADING party's terms, not always the Democrat's.
   The underlying datum is still prob_dem — that is the only form comparable
   across races — but "캔자스 18.8%" was read as a Republican number by a
   reader who had just seen Polymarket quote the Republican leg at 81%. Both
   were right; the column simply never said whose probability it was.

   So the party is now printed next to every number. That matters most where
   the two columns disagree in DIRECTION: Texas Senate quotes the market at
   공화 51.0% and the polls at 민주 51.1%. Those look like the same number and
   are opposite claims, which is exactly the divergence this board exists to
   show — the party word and the blue/red flip carry it. */
function probCell(p, missingText, unmapped) {
  const td = el("td", "num prob");
  if (p == null) {
    td.appendChild(el("span", "none", missingText));
    return td;
  }
  /* `p` is the TWO-PARTY ratio D/(D+R). Where a third candidate holds real
     money that ratio is not what the market trades: Nebraska prices Ricketts
     0.725, the Democrat 0.0025 and an independent 0.265, so D/(D+R) makes the
     Republican 99.7% — "100%" — by deleting the 26.5% on the independent.

     Rescaling by the share NOT on third candidates recovers the real figure,
     73%, which is the raw price renormalized over everything traded. For a
     clean two-way race unmapped is 0 and this changes nothing. */
  const off = unmapped || 0;
  const demShare = (1 - off) * p;
  const repShare = (1 - off) * (1 - p);

  const dem = demShare >= repShare;
  const shown = dem ? demShare : repShare;
  const color = dem ? "var(--dem)" : "var(--rep)";

  const wrap = el("div", "pcell");
  const bar = el("div", "pbar");
  const fill = el("i");
  /* Width tracks the number printed beside it. Filling to prob_dem while
     colouring by the leader drew Kansas as an 18.8%-wide RED bar — the length
     said Democrat, the colour said Republican. */
  fill.style.width = (100 * shown) + "%";
  fill.style.background = color;
  bar.appendChild(fill);
  wrap.appendChild(bar);

  const num = el("span", "pnum");
  /* No inline day-change here. It only appears on a couple of rows, so it
     pushed those numbers out of the column while the rest stayed put — and
     the marquee above already lists every market that moved. */
  num.innerHTML = "<span class='pparty' style='color:" + color + "'>" +
                  (dem ? "민주" : "공화") + "</span> " + FMT(shown, 1);
  wrap.appendChild(num);
  td.appendChild(wrap);
  return td;
}

/* ---------- model chips + detail ---------- */
/* One cell standing in for the four models, by TALLY of the directional ones
   — all four since 2026-08-09, when attention started comparing the two
   candidates' pageviews to each other.

   A tally, not a weighted average. Averaging the four z-scores would mint a
   new number on a scale nobody fitted — the exact move v3 exists to avoid.
   Counting how many models point which way invents nothing, and it keeps
   disagreement visible: 2-vs-1 reads "엇갈림", not a confident middle. */
function modelSummary(models) {
  const dir = models.filter(m => m.directional && m.n_available > 0 &&
                                 (m.lean === "D" || m.lean === "R"));
  const box = el("div", "chips");
  if (!dir.length) {
    box.appendChild(el("span", "chip", "지표 없음"));
    return box;
  }
  const d = dir.filter(m => m.lean === "D").length;
  const r = dir.filter(m => m.lean === "R").length;

  let cls = "chip sum", text;
  if (d === r) {
    /* A dead heat only happens when a model is missing, so there is no
       majority to report and nothing here to break the tie with. */
    text = "경합";
  } else {
    const dem = d > r;
    cls += dem ? " d" : " r";
    text = dem ? "민주 우세" : "공화 우세";
  }
  const chip = el("span", cls, text);
  chip.title = "데이터가 있는 모델 " + dir.length + "개 중 민주 " + d +
    " / 공화 " + r + ". 행을 누르면 모델별로 볼 수 있습니다.";
  box.appendChild(chip);
  return box;
}

function modelChips(models) {
  const box = el("div", "chips");
  models.forEach(m => {
    let cls = "chip", text;
    if (m.n_available === 0) {
      text = m.label.replace(" 모델", "") + " –";
    } else if (m.directional) {
      cls += " " + (m.lean === "D" ? "d" : m.lean === "R" ? "r" : "");
      text = m.label.replace(" 모델", "") + " " + LEAN_ARROW[m.lean];
    } else {
      cls += " a";
      text = "관심 " + LEVEL_WORD[m.level];
    }
    const chip = el("span", cls, text);
    chip.title = m.question;
    box.appendChild(chip);
  });
  return box;
}

function modelCard(m) {
  const card = el("div", "model");
  card.appendChild(el("h4", null, m.label));
  card.appendChild(el("div", "q", m.question));

  if (m.n_available === 0) {
    card.appendChild(el("div", "verdict", "—"));
    const why = el("div", "meta", WHY_NONE[m.unavailable] || m.unavailable);
    // The raw reason is a diagnostic string from the adapter, often in
    // English. It belongs on hover, not in the reading flow.
    if (m.reason) why.title = m.reason;
    card.appendChild(why);
    return card;
  }

  const verdict = el("div", "verdict");
  if (m.directional) {
    verdict.style.color = m.lean === "D" ? "var(--dem)"
                        : m.lean === "R" ? "var(--rep)" : "var(--ink-2)";
    verdict.textContent = m.lean === "N" ? "경합"
      : LEAN_WORD[m.lean] + "당 " + STRENGTH[m.strength];
  } else {
    verdict.style.color = "var(--ink)";
    verdict.textContent = "평소보다 " + LEVEL_WORD[m.level];
  }
  card.appendChild(verdict);

  /* Each model is graded against a different reference, and saying "평소 대비
     표준편차" for all four was wrong once the two-sided variables stopped
     being z-scored (2026-08-08). Money is now a −1~+1 side-vs-side contrast,
     which is not a standard deviation and has no %p reading. */
  const b = BASIS[m.key] || BASIS._default;
  const meta = el("div", "meta");
  meta.innerHTML = "<div>지표 " + m.n_available + "/" + m.n_total + "개 사용</div>";
  card.appendChild(meta);

  const vars = el("div", "vars");
  if (b.unit) {
    const note = el("div", "unit-note");
    note.innerHTML = b.unit;
    vars.appendChild(note);
  }
  /* Zero-weight variables are retired, not merely unavailable — they must not
     be listed as if they contributed. Burn rate still computes a contrast of
     +0.99 on Ohio and would read as the model's strongest input while the
     header truthfully says "3/3개 사용". */
  m.variables.filter(v => v.weight > 0).forEach(v => {
    const row = el("div", v.z == null ? "off" : null);
    row.appendChild(el("span", null, v.label));
    row.appendChild(el("span", "z", v.z == null
      ? (WHY_NONE[v.availability] || "없음")
      : _sideText(v)));
    row.lastChild.innerHTML = v.z == null
      ? (WHY_NONE[v.availability] || "없음") : _sideText(v);
    if (v.z == null && v.reason) row.title = v.reason;
    vars.appendChild(row);
  });
  card.appendChild(vars);
  return card;
}

/* ---------- race table ---------- */
/* How many rows each chamber shows. forecast.json carries the UNION of the
   two volume rankings (board.rank), which is more than this — so whichever
   metric is selected, its own top N is fully present and the table is not
   showing a list assembled under the other metric. */
const SHOW_N = { senate: 10, house: 10, governor: 10 };
let TAB = "senate";                    // which chamber's table is open

function raceTable(races, chamberKey) {
  const rows = races.slice()
    .sort((a, b) => b.betting.volume - a.betting.volume)
    .slice(0, SHOW_N[chamberKey] || undefined);

  const table = el("table");
  const thead = el("thead");
  thead.innerHTML =
    "<tr><th></th><th>선거구</th>" +
    "<th class='prob'>베팅 시장</th><th class='prob'>여론조사</th>" +
    "<th>매크로 지표</th><th class='num'>누적 거래액</th></tr>";
  table.appendChild(thead);
  const tbody = el("tbody");

  rows.forEach((r, i) => {
    const tr = el("tr");
    /* Position under the CURRENT sort, not the rank the pipeline baked in
       under its own metric — otherwise switching the toggle leaves a column
       of numbers that no longer counts 1, 2, 3. */
    tr.appendChild(el("td", "rank", i + 1));

    const name = el("td");
    const cands = [r.candidates.D, r.candidates.R]
      .filter(Boolean)
      .map(s => s.replace(/\s*\((D|R)\)\s*$/, "").replace(/ Party$/, "당"));
    name.innerHTML = "<div class='race-name'>" + r.label + "</div>";
    tr.appendChild(name);

    /* A big independent no longer blanks the cell. It only blanks when the
       third candidate is actually AHEAD of both parties — then the leader is
       someone we cannot name, and printing a party would be the lie. */
    const um = r.betting.unmapped_mass || 0;
    const partyLeads = r.betting.prob_dem != null &&
                       (1 - um) * Math.max(r.betting.prob_dem,
                                           1 - r.betting.prob_dem) >= um;
    tr.appendChild(probCell(
      partyLeads ? r.betting.prob_dem : null,
      r.betting.prob_dem == null ? "시장 없음" : "무소속이 선두",
      um));
    tr.appendChild(probCell(
      r.polls ? r.polls.prob_dem : null, "여론조사 없음", 0));

    const chips = el("td");
    chips.appendChild(modelSummary(r.models));
    tr.appendChild(chips);

    const vol = el("td", "num");
    /* Cumulative only. Polymarket omits volume1wk/volume24hr entirely on
       markets with no recent trades — 435 of 697 events on 2026-08-08 — and
       reading the absent key as 0 printed "$0 in a week" next to $119K
       cumulative on South Carolina. Absent is not zero. */
    vol.innerHTML = MONEY(r.betting.volume);
    tr.appendChild(vol);
    tbody.appendChild(tr);

    // Detail row — the four models expanded, with each variable underneath.
    const detail = el("tr", "detail");
    detail.style.display = "none";
    const cell = el("td");
    cell.colSpan = 6;
    const models = el("div", "models");
    r.models.forEach(m => models.appendChild(modelCard(m)));
    cell.appendChild(models);
    const bits = [];
    if (r.polls) {
      bits.push("여론조사 " + r.polls.n_polls + "건 집계, 최근 " +
        (r.polls.latest_date || "?") + " · 평균 마진 민주 " +
        (r.polls.margin_dem > 0 ? "+" : "") + r.polls.margin_dem + "p");
    }
    if (r.reference && r.reference.rating) {
      bits.push("전문가 등급 " + r.reference.rating);
    }
    if (r.reference && r.reference.incumbent) {
      bits.push("현직 " + r.reference.incumbent +
        " (" + r.reference.incumbent_party + ")");
    }
    if (bits.length) cell.appendChild(el("p", "explain", bits.join(" · ")));
    detail.appendChild(cell);
    tbody.appendChild(detail);

    tr.addEventListener("click", () => {
      detail.style.display = detail.style.display === "none" ? "" : "none";
    });
  });

  table.appendChild(tbody);
  return table;
}

/* forecast.json carries internal source keys ("fec_in_state_share"); the page
   should name the institution the number came from. Keys that map to the same
   body collapse to one entry. */
const SOURCE_NAME = {
  polymarket: "Polymarket",
  polls: "NYT",
  econ_claims: "FRED (세인트루이스 연준)",
  econ_unemployment: "FRED (세인트루이스 연준)",
  econ_coincident: "필라델피아 연준 작성",
  fec_in_state_share: "FEC (연방선거관리위원회)",
  fec_small_dollar_count: "FEC (연방선거관리위원회)",
  fec_unique_donors: "FEC (연방선거관리위원회)",
  fec_repeat_donor_rate: "FEC (연방선거관리위원회)",
  fec_burn_rate: "FEC (연방선거관리위원회)",
  primary_turnout_ratio: "주정부 국무장관 인증 결과",
  party_reg_net_change: "주정부 유권자 등록 통계",
  wiki_pageviews_share: "Wikimedia",
  wiki_edit_count: "Wikimedia",
  gdelt: "GDELT", reddit: "Reddit", youtube: "YouTube", kalshi: "Kalshi"
};
function _sourceNames(keys) {
  const seen = [];
  (keys || []).forEach(k => {
    const n = SOURCE_NAME[k] || k;
    if (!seen.includes(n)) seen.push(n);
  });
  return seen.join(", ");
}

/* ---------- render ---------- */
function render(doc) {
  const app = document.getElementById("app");
  app.innerHTML = "";

  document.getElementById("stamp").textContent =
    new Date(doc.meta.generated_at).toLocaleString("ko-KR") + " 기준";

  if (doc.balance_of_power && doc.balance_of_power.length) {
    app.appendChild(balanceSection(doc.balance_of_power));
  }

  const chSec = el("section");
  chSec.appendChild(el("h2", null, "세부 전망"));
  const grid = el("div", "chambers");
  /* Governor is left out: it has no control market and no verified held-over
     seat split, so its card would be the only empty one. Its races are still
     in the table below. */
  ["senate", "house"].forEach(k => {
    if (doc.chambers[k]) grid.appendChild(chamberCard(k, doc.chambers[k]));
  });
  chSec.appendChild(grid);
  app.appendChild(chSec);

  const mv = moversSection(doc.movers || []);
  if (mv) app.appendChild(mv);

  /* One chamber at a time. Stacking all three ran past three screens, and
     nobody compares a Senate row against a House row anyway — the seats are
     not the same kind of contest. */
  const present = ["senate", "house", "governor"]
    .filter(k => doc.races.some(r => r.chamber === k));
  if (present.length) {
    if (!present.includes(TAB)) TAB = present[0];

    const s = el("section");
    const head = el("div", "sec-head");
    head.appendChild(el("h2", null, "개별 선거"));

    const tabs = el("div", "tabs");
    present.forEach(k => {
      const b = el("button", "tab" + (TAB === k ? " on" : ""),
                   doc.chambers[k].label);
      b.addEventListener("click", () => {
        if (TAB === k) return;
        TAB = k;
        render(doc);
      });
      tabs.appendChild(b);
    });
    head.appendChild(tabs);
    s.appendChild(head);

    const races = doc.races.filter(r => r.chamber === TAB);
    s.appendChild(el("p", "sub",
      "누적 베팅 거래액순 상위 " +
      Math.min(races.length, SHOW_N[TAB] || races.length) + "곳."));
    const tw = el("div", "table-wrap");
    tw.appendChild(raceTable(races, TAB));
    s.appendChild(tw);
    app.appendChild(s);
  }

  const notes = el("section");
  notes.appendChild(el("h2", null, "각주"));
  const card = el("div", "card");
  card.innerHTML =
    "<p class='explain' style='margin-top:0'><b>여론조사</b>는 수기로 입력한 " +
    "조사를 최신순·표본 크기순으로 가중 평균한 뒤 확률로 바꾼 값입니다.</p>" +
    "<p class='explain'>데이터 출처: " + _sourceNames(doc.meta.sources_used) +
    (doc.meta.sources_missing.length
      ? " · 이번에 실패: " + _sourceNames(doc.meta.sources_missing) : "") +
    "</p>";
  notes.appendChild(card);
  app.appendChild(notes);
}

/* ---------- theme toggle ---------- */
document.getElementById("theme").addEventListener("click", () => {
  // No attribute == dark, because :root IS the dark palette.
  const light = document.documentElement.getAttribute("data-theme") === "light";
  document.documentElement.setAttribute("data-theme", light ? "dark" : "light");
});

/* ---------- load ---------- */
/* "no-cache" revalidates rather than refusing the cache outright. The file
   changes once a day, so a repeat visitor gets a 304 with an empty body
   instead of re-downloading the whole payload — the difference matters on a
   metered static host. "no-store" would have forced a full transfer each
   time; plain caching would have served yesterday's numbers. */
fetch("forecast.json", { cache: "no-cache" })
  .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
  .then(doc => {
    if (!String(doc.meta && doc.meta.schema_version).startsWith("3.")) {
      throw new Error("forecast.json이 v" + doc.meta.schema_version +
        " 형식입니다. 이 페이지는 v3를 읽습니다 — `python3 -m election2026 run`을 다시 실행하세요.");
    }
    window.__DOC = doc;
    render(doc);
  })
  .catch(err => {
    document.getElementById("app").innerHTML =
      "<p class='error'><b>데이터를 불러오지 못했습니다.</b><br>" + err.message +
      "<br><br>이 페이지는 파일을 직접 열면 동작하지 않습니다. 터미널에서<br>" +
      "<code>python3 -m election2026.serve</code><br>" +
      "를 실행한 뒤 <code>http://localhost:8000/dashboard.html</code> 로 " +
      "접속하세요.</p>";
  });
</script>
</body>
